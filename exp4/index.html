<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sample Web Page Design</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="exp4.css">
</head>

<body>

    <h2 class="sample-title">Sample web page design:</h2>

    <div class="container">

        <!-- ================= HEADER ================= -->

        <header class="header">

            <div class="logo">

                <div class="flower">
                    🌸
                </div>

                <div class="apple">
                    🍎
                </div>

            </div>

        </header>


        <!-- ================= NAVIGATION ================= -->

        <nav class="navbar">

            <a href="#" class="active">Home</a>
            <a href="#">About</a>
            <a href="#">World</a>
            <a href="#">Others</a>

        </nav>


        <!-- ================= FRUITS ================= -->

        <section class="fruits-section">

            <div class="fruit-box">

                <h3>Favorites</h3>

                <div class="fruit-item">
                    <span>Apple</span>
                    <span>🍎</span>
                </div>

                <div class="fruit-item">
                    <span>Mango</span>
                    <span>🥭</span>
                </div>

                <div class="fruit-item">
                    <span>Banana</span>
                    <span>🍌</span>
                </div>

                <div class="fruit-item">
                    <span>Orange</span>
                    <span>🍊</span>
                </div>

            </div>

        </section>


        <!-- ================= LOGIN SECTION ================= -->

        <section class="login-section">

            <div class="forms-container">

                <!-- SIGN IN -->

                <form class="form-box">

                    <h2>Sign In</h2>

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        placeholder="Enter Username / Email / Phone Number"
                        required
                    >

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter Password"
                        required
                    >

                    <button type="submit">
                        Sign In
                    </button>

                </form>


                <!-- SIGN UP -->

                <form class="form-box">

                    <h2>Sign Up</h2>

                    <label for="name">
                        Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter Name"
                        required
                    >

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter Email"
                        required
                    >

                    <label for="newpassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="newpassword"
                        placeholder="Enter Password"
                        required
                    >

                    <button type="submit">
                        Sign Up
                    </button>

                </form>

            </div>

        </section>


        <!-- ================= FOOTER ================= -->

        <footer>

            <h3>Your address</h3>

            <p>
                © 2020-2021. (Register number) -
                Web Technology Lab Batch 1.
                All Rights Reserved.
            </p>

        </footer>

    </div>

</body>
</html>
