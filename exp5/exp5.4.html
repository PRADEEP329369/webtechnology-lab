<!DOCTYPE html>
<html>
<head>
    <title>Coin Flip</title>
</head>
<body>
<h3>Reg No: URK24CS1182</h3>
<h1>Heads or Tails?</h1>
<div>
    <img src="head.jpg" id="coin" width="150" height="150">
    <br><br>
    <button id="flip">Flip!</button>
</div>
<p>
    Heads Total:
    <span id="num_heads">0</span>
    <br>
    Tails Total:
    <span id="num_tails">0</span>
</p>
<script>
let heads = 0;
let tails = 0;
document.getElementById("flip").addEventListener(
    "click",
    flipFunction
);
function flipFunction() {
    let result = Math.floor(Math.random() * 2);
    if (result == 0) {
        document.getElementById("coin").src = "head.jpg";
        heads++;
        document.getElementById("num_heads").innerHTML = heads;
    }
    else {
        document.getElementById("coin").src = "tail.jpg";
        tails++;
        document.getElementById("num_tails").innerHTML = tails;
    }
}
</script>
</body>
</html>
